seed: 20261003
target_category: Все категории
training_period_end: '2023-12'
minimum_history: 12
origins: ['2023-12', '2024-03', '2024-06', '2024-09']
horizons: [1, 3, 6, 12]
evaluation: exact_horizon
sample: all_municipalities_complete_in_2023
missing_training_values: forward_fill_using_past_only
missing_test_values: exclude_observation_for_every_model
workers: 6
models:
  - last_value
  - seasonal_naive
  - damped_trend
  - prophet_auto
  - prophet_monthly
  - pooled_ridge
  - pooled_ridge_news
  - chronos_bolt_tiny
prophet:
  changepoint_prior_scale: 0.05
  seasonality_prior_scale: 1.0
  n_changepoints: 5
  yearly_fourier_order: 3
ridge:
  alpha: 20.0
  minimum_lags: 6
  maximum_recursive_monthly_change: 0.25
damped_trend:
  recent_months: 6
  damping: 0.85
  maximum_monthly_growth: 0.03
chronos:
  model_id: amazon/chronos-bolt-tiny
  batch_size: 128
  device: cpu
  quantile: 0.5
detectors:
  calibration_seed: 20261003
  evaluation_seed: 20261004
  synthetic_null_calibration_series: 300
  synthetic_test_series_per_kind: 150
  alarm_false_positive_target: 0.05
  warmup: 12
  cusum_drift: 0.5
  page_hinkley_drift: 0.25
  ewma_alpha: 0.3
