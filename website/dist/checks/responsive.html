<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Проверка адаптивности — РядТерра</title>
<style>
body{margin:0;background:#ececf0;color:#17171b;font:16px/1.5 system-ui,sans-serif}header{padding:14px 20px;background:white;display:flex;gap:18px;align-items:center;flex-wrap:wrap}h1{font-size:17px;margin:0}label{display:flex;gap:10px;align-items:center}select{font:inherit;padding:8px}main{padding:20px;width:max-content;min-width:100%;box-sizing:border-box}iframe{display:block;width:390px;height:900px;border:1px solid #b5b5bd;background:white}a{color:#0060c8}select:focus-visible,a:focus-visible{outline:3px solid #0060c8;outline-offset:3px}
</style>
</head>
<body>
<header><h1>РядТерра · проверка адаптивности</h1><label>Ширина окна <select id="viewport-width"><option value="320">320 px</option><option value="390" selected>390 px</option><option value="834">834 px</option><option value="1440">1440 px</option></select></label><label>Размер текста <select id="text-size"><option value="100">100%</option><option value="200">200%</option></select></label><label>Проверка вставки <textarea id="paste-check" rows="2" aria-label="Поле для проверки вставки команд"></textarea></label><a href="../">Открыть сайт</a></header>
<main><iframe id="site-frame" title="РядТерра в выбранной ширине окна" src="../"></iframe></main>
<script>
document.getElementById('viewport-width').addEventListener('change',function(){document.getElementById('site-frame').style.width=this.value+'px';});
function textSize(){document.getElementById('site-frame').contentDocument.documentElement.style.fontSize=document.getElementById('text-size').value+'%';}
document.getElementById('text-size').addEventListener('change',textSize);
document.getElementById('site-frame').addEventListener('load',textSize);
</script>
</body>
</html>
